<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoreboard — 楽譜ビューア</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs" type="module"></script>
  <style>
    :root{--bg:#10120f;--panel:#181b16;--panel2:#20251e;--line:#30372c;--ink:#f2f0e8;--muted:#9ba293;--accent:#d7e56d;--accent2:#7da05a;--shadow:0 24px 80px #0008}
    *{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 75% -20%,#34442b 0,#10120f 42%);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
    header{height:72px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between;padding:0 34px;background:#11140fbb;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
    .brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.05em}.mark{width:32px;height:32px;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;border-radius:9px;font-family:Georgia;font-size:20px}.brand span{color:var(--muted);font-weight:500;margin-left:5px;font-size:12px}
    main{max-width:1440px;margin:0 auto;padding:42px 34px 70px}.hero{display:flex;justify-content:space-between;align-items:end;margin-bottom:28px}.eyebrow{color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.22em;font-weight:700}.hero h1{font:400 clamp(30px,4vw,52px)/1.05 Georgia,serif;margin:9px 0 0;letter-spacing:-.04em}.hero p{color:var(--muted);margin:12px 0 0;max-width:520px}.upload{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow);min-width:310px}.upload strong{display:block;font-size:14px}.upload small{color:var(--muted);display:block;margin-top:3px}.btn{cursor:pointer;border:0;background:var(--accent);color:#1e2616;padding:11px 16px;border-radius:9px;font-weight:800;white-space:nowrap}.btn:hover{filter:brightness(1.08)}
    .workspace{border:1px solid var(--line);background:#121510dd;border-radius:20px;box-shadow:var(--shadow);overflow:hidden}.toolbar{min-height:66px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--panel)}.toolbar .label{color:var(--muted);font-size:12px}.modes{display:flex;gap:4px;background:#0e100d;border:1px solid var(--line);padding:4px;border-radius:10px}.mode{background:transparent;color:var(--muted);border:0;padding:8px 12px;border-radius:7px;cursor:pointer;font-size:12px}.mode.active{background:var(--panel2);color:var(--ink);box-shadow:0 0 0 1px #ffffff12}.spacer{flex:1}.control{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.control select,.control input{background:#0f120e;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px 9px}.zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden}.zoom button{background:#141812;border:0;color:var(--ink);padding:7px 11px;cursor:pointer}.zoom span{min-width:52px;text-align:center;color:var(--muted);font-size:12px}
    .empty{min-height:490px;display:grid;place-items:center;padding:45px}.drop{border:1px dashed #68735b;background:#1a2017;border-radius:18px;padding:54px 70px;text-align:center;max-width:520px;width:100%;transition:.2s}.drop.drag{border-color:var(--accent);background:#26351f}.note{color:var(--muted);font-size:12px;margin-top:10px}.music{font-size:42px;line-height:1;color:var(--accent);font-family:Georgia;margin-bottom:15px}.hint{color:var(--muted);font-size:12px;margin:16px 0 0}
    #viewer{display:none;padding:24px;min-height:540px;background:#0d0f0c}.pages{display:grid;gap:18px;align-items:start}.pages.grid-1{grid-template-columns:1fr}.pages.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.pages.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.pages.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.pages.scroll{display:flex;overflow-x:auto;align-items:flex-start;padding-bottom:16px}.page-card{background:#f8f7f1;padding:8px;border-radius:3px;box-shadow:0 15px 30px #0007;min-width:0}.scroll .page-card{flex:0 0 auto;width:min(68vw,760px)}canvas{display:block;width:100%;height:auto}.page-num{text-align:center;color:#68705f;font-size:10px;padding:5px 0 0}.loading{color:var(--muted);text-align:center;padding:80px}.status{padding:12px 18px;color:var(--muted);font-size:12px;border-top:1px solid var(--line);display:none}.status.show{display:block}@media(max-width:800px){header{padding:0 18px}main{padding:30px 14px}.hero{display:block}.upload{margin-top:22px;min-width:0}.toolbar{flex-wrap:wrap}.spacer{display:none}.pages.grid-3,.pages.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.drop{padding:42px 22px}}
    .workspace:fullscreen{border-radius:0;background:#0d0f0c}.workspace:fullscreen #viewer{height:calc(100vh - 66px);overflow:auto;padding:20px}.workspace:fullscreen .page-card{display:flex;flex-direction:column;align-items:center}.workspace:fullscreen canvas{width:auto;max-width:100%;max-height:calc(100vh - 145px)}
    .workspace:fullscreen canvas{-webkit-font-smoothing:antialiased;image-rendering:auto}body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI","Yu Gothic",Meiryo,sans-serif}.pages.scroll{gap:0}.pages.scroll .page-card{margin-right:calc(var(--overlap,80px) * -1)}
  </style>
</head>
<body>
<header><div class="brand"><div class="mark">♪</div> SCOREBOARD <span>PDF MUSIC VIEWER</span></div><div id="fileName" style="color:var(--muted);font-size:12px">No score loaded</div></header>
<main>
  <section class="hero"><div><div class="eyebrow">A calm space for the page</div><h1>楽譜を、横に並べて。</h1><p>譜めくりの感覚で眺める、ローカルPDFビューア。ページ数や表示倍率を変えながら、楽譜全体を見渡せます。</p></div><div><div class="upload"><div style="font-size:24px">↥</div><div style="flex:1"><strong>PDFを読み込む</strong><small>ファイルはこのブラウザ内で処理されます</small></div><button class="btn" id="choose">ファイルを選ぶ</button><input type="file" id="file" accept="application/pdf" hidden></div><div style="color:var(--muted);font-size:11px;margin:10px 4px 0">🔒 選択したPDFだけを読み込みます。アップロード・保存はせず、他のローカルファイルにはアクセスしません。</div></div></section>
  <section class="workspace">
    <div class="toolbar"><span class="label">表示</span><div class="modes"><button class="mode active" data-mode="grid">敷き詰め</button><button class="mode" data-mode="scroll">横スクロール</button></div><div class="control" id="countControl"><span>列数</span><select id="cols"><option value="1">1</option><option value="2" selected>2</option><option value="3">3</option><option value="4">4</option></select></div><div class="spacer"></div><div class="zoom"><button id="minus">−</button><span id="zoomText">100%</span><button id="plus">＋</button></div><button class="mode" id="fullscreen" title="フルスクリーン">⛶ 全画面</button><button class="btn" id="clear" style="background:#2d352b;color:var(--ink);display:none">閉じる</button></div>
    <div class="empty" id="empty"><div class="drop" id="drop"><div class="music">𝄞</div><strong>ここにPDFをドロップ</strong><div class="note">または「ファイルを選ぶ」から楽譜を読み込みます</div><div class="hint">対応形式：PDF　/　ページ画像は端末内でのみ処理</div></div></div>
    <div id="viewer"><div id="pages" class="pages grid-2"></div></div><div id="status" class="status"></div>
  </section>
</main>
<script type="module">
  const pdfjs = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs');
  pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs';
  const $=s=>document.querySelector(s); let pdf=null, zoom=1, mode='grid';
  $('#choose').onclick=()=>$('#file').click(); $('#file').onchange=e=>e.target.files[0]&&load(e.target.files[0]);
  const drop=$('#drop'); ['dragenter','dragover'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.add('drag')})); ['dragleave','drop'].forEach(x=>drop.addEventListener(x,e=>{e.preventDefault();drop.classList.remove('drag')})); drop.addEventListener('drop',e=>e.dataTransfer.files[0]&&load(e.dataTransfer.files[0]));
  async function load(file){ if(file.type!=='application/pdf')return; $('#fileName').textContent=file.name; $('#empty').style.display='none'; $('#viewer').style.display='block'; $('#clear').style.display='block'; $('#status').classList.add('show'); $('#status').textContent='読み込み中…'; pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise; render(); }
  async function render(){ if(!pdf)return; const pages=$('#pages'); pages.innerHTML='<div class="loading">ページを描画しています…</div>'; pages.className='pages '+(mode==='scroll'?'scroll':'grid-'+$('#cols').value); const frag=document.createDocumentFragment(); for(let n=1;n<=pdf.numPages;n++){const p=await pdf.getPage(n), base=p.getViewport({scale:1}), width=mode==='scroll'?700:Math.min(900,(document.querySelector('#viewer').clientWidth-48-18*($('#cols').value-1))/$('#cols').value), scale=width/base.width*zoom, v=p.getViewport({scale}); const card=document.createElement('div');card.className='page-card';const c=document.createElement('canvas');c.width=v.width;c.height=v.height;card.append(c);const label=document.createElement('div');label.className='page-num';label.textContent=`${n} / ${pdf.numPages}`;card.append(label);frag.append(card);await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;} pages.innerHTML='';pages.append(frag); $('#status').textContent=`${pdf.numPages}ページ　・　${mode==='scroll'?'横スクロール':'敷き詰め'}　・　倍率 ${Math.round(zoom*100)}%`; }
  document.querySelectorAll('.mode[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.mode[data-mode]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;$('#countControl').style.opacity=mode==='scroll'?'.35':'1';render()}); $('#cols').onchange=render; $('#minus').onclick=()=>{zoom=Math.max(.5,zoom-.1);$('#zoomText').textContent=Math.round(zoom*100)+'%';render()}; $('#plus').onclick=()=>{zoom=Math.min(1.8,zoom+.1);$('#zoomText').textContent=Math.round(zoom*100)+'%';render()}; $('#fullscreen').onclick=async()=>{if(!document.fullscreenElement){await $('.workspace').requestFullscreen();$('#fullscreen').textContent='⛶ 終了'}else{await document.exitFullscreen();$('#fullscreen').textContent='⛶ 全画面'}}; document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement)$('#fullscreen').textContent='⛶ 全画面'}); $('#clear').onclick=()=>location.reload();
  async function load(file){ if(file.type!=='application/pdf')return; $('#fileName').textContent=file.name; $('#empty').style.display='none'; $('#viewer').style.display='block'; $('#clear').style.display='block'; $('#status').classList.add('show'); $('#status').textContent='読み込み中…'; pdf=await pdfjs.getDocument({data:await file.arrayBuffer(),cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/standard_fonts/'}).promise; render(); }
  async function load(file){ if(file.type!=='application/pdf')return; $('#fileName').textContent=file.name; $('#empty').style.display='none'; $('#viewer').style.display='block'; $('#clear').style.display='block'; $('#status').classList.add('show'); $('#status').textContent='読み込み中…'; try { pdf=await pdfjs.getDocument({data:await file.arrayBuffer(),cMapUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/cmaps/',cMapPacked:true,standardFontDataUrl:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/standard_fonts/'}).promise; } catch(error) { console.warn('CMap fallback',error); pdf=await pdfjs.getDocument({data:await file.arrayBuffer()}).promise; } render(); }
</script>
<script>
  window.addEventListener('keydown', (event) => {
    if (event.key !== 'PageDown' && event.key !== 'PageUp') return;
    const viewer = document.querySelector('#viewer');
    const pages = document.querySelector('#pages');
    if (!viewer || viewer.style.display === 'none' || !pages || document.activeElement.closest('input,select,textarea')) return;
    event.preventDefault();
    const amount = Math.max(320, viewer.clientHeight - 90);
    const horizontal = pages.classList.contains('scroll');
    const target = horizontal ? pages : viewer;
    target.scrollBy({left: horizontal ? (event.key === 'PageDown' ? amount : -amount) : 0, top: horizontal ? 0 : (event.key === 'PageDown' ? amount : -amount), behavior: 'smooth'});
  });
</script>
<script>
  document.querySelector('#choose')?.addEventListener('click',()=>document.querySelector('#file')?.click());
  window.addEventListener('error',e=>{const s=document.querySelector('#status');if(s){s.classList.add('show');s.textContent='読み込みエラー：ページを再読み込みしてください。';}});
  const overlapControl = document.createElement('div');
  overlapControl.className = 'control';
  overlapControl.id = 'overlapControl';
  overlapControl.innerHTML = '<span>重なり</span><input id="overlap" type="number" min="0" max="240" step="10" value="80" style="width:64px" title="次のページを見せる幅（px）"><span>px</span>';
  document.querySelector('.toolbar .spacer').before(overlapControl);
  const overlap = document.querySelector('#overlap');
  const pagesForOverlap = document.querySelector('#pages');
  const updateOverlap = () => pagesForOverlap.style.setProperty('--overlap', `${Math.max(0, Math.min(240, Number(overlap.value) || 0))}px`);
  overlap.addEventListener('input', updateOverlap); updateOverlap();
  const updateOverlapVisibility = () => { overlapControl.style.opacity = document.querySelector('.mode[data-mode="scroll"]').classList.contains('active') ? '1' : '.35'; };
  document.querySelectorAll('.mode[data-mode]').forEach(button => button.addEventListener('click', updateOverlapVisibility));
  updateOverlapVisibility();
</script>
</body></html>
